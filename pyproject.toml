[project]
name = "quantum-capstone"
version = "0.1.0"
description = "Learning notebooks connecting probability, Poisson rewards, Monte Carlo, and local Qiskit experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "qiskit[visualization]>=2.5.2",
    "scipy>=1.18.1",
]
